buildscript {
	ext.kotlin_version = "1.8.22"

	repositories {
		google()
		mavenCentral()
		mavenLocal()
		maven {
			url = uri("https://zapt-mvn-repository.appspot.com")
			name = "ZaptTech"
		}
	}

	dependencies {
		classpath "com.android.tools.build:gradle:8.4.2"
		classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
	}
}

allprojects {
	repositories {
		google()
		mavenCentral()
		mavenLocal()
		maven {
			url = uri("https://zapt-mvn-repository.appspot.com")
			name = "ZaptTech"
		}
	}
}

task clean(type: Delete) {
	delete rootProject.buildDir
}
